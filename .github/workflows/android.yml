name: Android CI
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "RELEASE_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Lint, test and build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease bundlePlay

      # Two things must never reach Google Play: the banking-app queries the donation sheet needs,
      # and the permission to install packages. Both are removed by the play manifest overlay, and
      # an overlay is exactly the kind of thing that stops working without anyone noticing.
      - name: Check what the Play build does not contain
        run: |
          manifest="app/build/intermediates/merged_manifest/play/processPlayMainManifest/AndroidManifest.xml"
          [ -f "$manifest" ] || { echo "::error::$manifest is missing; the build layout changed."; exit 1; }
          for forbidden in REQUEST_INSTALL_PACKAGES "<queries"; do
            if grep -q "$forbidden" "$manifest"; then
              echo "::error::The Play manifest still contains $forbidden."
              exit 1
            fi
          done
          release="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          grep -q REQUEST_INSTALL_PACKAGES "$release" || {
            echo "::error::The sideloaded build lost REQUEST_INSTALL_PACKAGES and can no longer update itself."
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deen-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: deen-release
          path: app/build/outputs/apk/release/*.apk
